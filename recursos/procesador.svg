    <path d="M187 255 H373 M582 255 H768" stroke="#d6dfdc" stroke-width="1"/>
    <text x="280" y="287" text-anchor="middle" font-size="{{TAMANO_C}}" font-weight="bold">{{TC}} °C</text>
    <text x="675" y="287" text-anchor="middle" font-size="{{TAMANO_D}}" font-weight="bold">{{TD}} °C</text>
    <text x="280" y="309" text-anchor="middle" font-size="14" fill="#596c64">T<tspan baseline-shift="sub" font-size="10">c</tspan>(t)</text>
    <text x="675" y="309" text-anchor="middle" font-size="14" fill="#596c64">T<tspan baseline-shift="sub" font-size="10">d</tspan>(t)</text>
    <text x="520" y="341" text-anchor="middle" font-size="13" fill="#596c64">{{ESCENARIO}} · t = {{TIEMPO}} s</text>
