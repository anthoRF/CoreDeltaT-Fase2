    <!-- Potencia y flujos calculados, en W. -->
    <path d="{{ENTRADA}}" stroke="#205847" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
    <text x="77" y="103" text-anchor="middle" font-size="13" fill="#596c64">POTENCIA</text>
    <text x="77" y="129" text-anchor="middle" font-size="20" font-weight="bold">{{POTENCIA}} W</text>
    <text x="77" y="179" text-anchor="middle" font-size="14" fill="#596c64">P</text>
    <path d="{{FLUJO_G}}" stroke="#205847" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
    <text x="477" y="103" text-anchor="middle" font-size="13" fill="#596c64">INTERCAMBIO</text>
    <text x="477" y="129" text-anchor="middle" font-size="20" font-weight="bold">{{CALOR_G}} W</text>
    <text x="477" y="180" text-anchor="middle" font-size="14" fill="#596c64">g |T<tspan baseline-shift="sub" font-size="10">c</tspan> − T<tspan baseline-shift="sub" font-size="10">d</tspan>|</text>
    <path d="{{FLUJO_H}}" stroke="#205847" stroke-width="2" fill="none" marker-end="url(#flecha)"/>
    <text x="909" y="103" text-anchor="middle" font-size="13" fill="#596c64">{{ETIQUETA_H}}</text>
    <text x="909" y="129" text-anchor="middle" font-size="20" font-weight="bold">{{CALOR_H}} W</text>
    <text x="909" y="180" text-anchor="middle" font-size="14" fill="#596c64">h |T<tspan baseline-shift="sub" font-size="10">d</tspan> − T<tspan baseline-shift="sub" font-size="10">a</tspan>|</text>
    <text x="909" y="211" text-anchor="middle" font-size="14" fill="#596c64">Ambiente {{AMBIENTE}} °C</text>
