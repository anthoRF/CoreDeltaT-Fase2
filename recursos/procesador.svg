<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Procesador y disipador: balance térmico</title>
  <desc id="descripcion">Procesador a {{TC}} grados Celsius y disipador a {{TD}} grados Celsius. Las flechas indican la dirección del flujo de calor.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7f8"/><stop offset=".4" stop-color="#d8dfe3"/><stop offset=".7" stop-color="#f3f5f6"/><stop offset="1" stop-color="#aab7bf"/></linearGradient>
    <linearGradient id="canto" x1="0" x2="1"><stop stop-color="#7f919c"/><stop offset=".5" stop-color="#cad3d8"/><stop offset="1" stop-color="#8c9da7"/></linearGradient>
    <linearGradient id="aluminio" x1="0" x2="1"><stop stop-color="#d9e0e4"/><stop offset=".45" stop-color="#f0f3f5"/><stop offset="1" stop-color="#9bacb7"/></linearGradient>
    <linearGradient id="cobre" x1="0" x2="1"><stop stop-color="#8f6246"/><stop offset=".35" stop-color="#cea27d"/><stop offset=".7" stop-color="#bb8964"/><stop offset="1" stop-color="#8b614b"/></linearGradient>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#205847"/></marker>
  </defs>
